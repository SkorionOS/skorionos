name: Sync to Mobile Cloud (139Yun)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, repair]
        default: audit
        required: true
permissions:
  contents: read
concurrency:
  group: sync-to-mobile-cloud
  cancel-in-progress: false
jobs:
  repair-current-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated temporary Alist
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name=temp-alist -p 127.0.0.1:5244:5244 xhofe/alist:v3.45.0 >/dev/null
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5244/ping >/dev/null 2>&1 && break; sleep 2; done
          PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PASSWORD"
          docker exec temp-alist ./alist admin set "$PASSWORD" >/dev/null 2>&1
          echo "ALIST_ADMIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Audit or repair only current release deltas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOBILE_CLOUD_AUTHORIZATION: ${{ secrets.MOBILE_CLOUD_AUTHORIZATION }}
          REPAIR_MODE: ${{ inputs.mode }}
        run: python3 .github/scripts/mobile-repair-current-release.py
      - name: Save sanitized audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-repair-audit
          path: /tmp/mobile-repair-report.json
          if-no-files-found: warn
      - name: Remove isolated temporary service
        if: always()
        run: docker rm -f temp-alist >/dev/null 2>&1 || true
